name: Deploy PlainSight to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare PlainSight site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site /tmp/plainsight
          mkdir -p _site /tmp/plainsight

          if [ -d "PlainSight" ]; then
            cp -R PlainSight/. _site/
          elif [ -f "PlainSight.zip" ]; then
            unzip -q PlainSight.zip -d /tmp/plainsight
            if [ -d "/tmp/plainsight/PlainSight" ]; then
              cp -R /tmp/plainsight/PlainSight/. _site/
            else
              cp -R /tmp/plainsight/. _site/
            fi
          else
            echo "PlainSight project not found. Add PlainSight.zip or the PlainSight/ folder to the repository."
            exit 1
          fi

          # PS.html is the real PlainSight homepage.
          # Keep the original project files unchanged and make GitHub Pages
          # open PS.html when visitors enter the site root.
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=PS.html">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PlainSight</title>
          </head>
          <body>
            <a href="PS.html">Open PlainSight</a>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
