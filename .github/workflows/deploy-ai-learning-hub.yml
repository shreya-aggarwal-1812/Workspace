name: Deploy Projects to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare websites
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site /tmp/plainsight /tmp/sekhani
          mkdir -p _site /tmp/plainsight /tmp/sekhani

          # -------------------------
          # PlainSight
          # -------------------------
          if [ -d "PlainSight" ]; then
            cp -R PlainSight/. _site/
          elif [ -f "PlainSight.zip" ]; then
            unzip -q PlainSight.zip -d /tmp/plainsight
            if [ -d "/tmp/plainsight/PlainSight" ]; then
              cp -R /tmp/plainsight/PlainSight/. _site/
            else
              cp -R /tmp/plainsight/. _site/
            fi
          else
            echo "PlainSight project not found."
            exit 1
          fi

          # PS.html is the real PlainSight homepage.
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=PS.html">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PlainSight</title>
          </head>
          <body>
            <a href="PS.html">Open PlainSight</a>
          </body>
          </html>
          EOF

          # -------------------------
          # Sekhani Pricing Simulator
          # -------------------------
          if [ -f "sekhani-pricing-simulator.zip" ]; then
            unzip -q sekhani-pricing-simulator.zip -d /tmp/sekhani
          else
            echo "sekhani-pricing-simulator.zip not found."
            exit 1
          fi

          mkdir -p _site/sekhani-pricing-simulator

          # Preserve the simulator's original folder structure. If the ZIP
          # contains a single top-level project folder, copy its contents;
          # otherwise copy the extracted contents directly.
          if [ -d "/tmp/sekhani/sekhani-pricing-simulator" ]; then
            cp -R /tmp/sekhani/sekhani-pricing-simulator/. _site/sekhani-pricing-simulator/
          else
            top_level_dirs=(/tmp/sekhani/*/)
            if [ "${#top_level_dirs[@]}" -eq 1 ] && [ -f "${top_level_dirs[0]}index.html" ]; then
              cp -R "${top_level_dirs[0]}". _site/sekhani-pricing-simulator/
            else
              cp -R /tmp/sekhani/. _site/sekhani-pricing-simulator/
            fi
          fi

          # If the simulator has an index.html, GitHub Pages will serve it at:
          # /Workspace/sekhani-pricing-simulator/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
