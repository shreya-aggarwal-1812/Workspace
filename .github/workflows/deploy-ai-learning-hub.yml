name: Deploy PlainSight to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare PlainSight site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R PlainSight/. _site/

          # GitHub Pages serves index.html by default. PlainSight's real homepage
          # is PS.html, so provide a root redirect without changing the project.
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=PS.html">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PlainSight</title>
          </head>
          <body>
            <p>Opening <a href="PS.html">PlainSight</a>...</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
